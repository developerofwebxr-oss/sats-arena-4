<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable disable pinch + double-tap zoom (mainly Android);
         touch-action below handles iOS, where these are ignored. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sats Arena</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        overflow: hidden;
        font-family: monospace;
        /* touch-action: manipulation removes the browser's double-tap-to-zoom
           gesture (the one rapid shooting was triggering) on iOS too, while
           leaving normal taps/clicks and our touch handlers working. */
        touch-action: manipulation;
      }

      /* The Three.js renderer canvas fills the whole window */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;   /* fallback */
        height: 100dvh;  /* dynamic viewport: tracks mobile chrome collapsing */
        touch-action: manipulation;
      }

      /* Mode switcher (SCREEN / VR / AR) styles live in src/modeswitcher.js. */

      /* Crosshair — pure CSS, zero Three.js cost.
         Fixed to screen centre so it's always your aim point. */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        pointer-events: none;
        user-select: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(247, 147, 26, 0.85);
      }
      /* Horizontal bar */
      #crosshair::before {
        width: 16px;
        height: 2px;
        top: 7px;
        left: 0;
      }
      /* Vertical bar */
      #crosshair::after {
        width: 2px;
        height: 16px;
        top: 0;
        left: 7px;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
