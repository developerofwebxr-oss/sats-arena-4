name: Deploy sats-arena-4 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'developerofwebxr-oss/sats-arena-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /sats-arena-4/
          VITE_LIGHTNING: "on"
          # Backend URL for both Lightning and LiveKit token endpoint
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sats-arena-4-production.up.railway.app' }}
          # LiveKit WebSocket URL (no key/secret — browser only needs the URL)
          VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'developerofwebxr-oss/sats-arena-4'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
